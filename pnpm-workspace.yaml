packages:
  - 'packages/*'
  - 'demo'

overrides:
  '@angular-devkit/architect': 0.2202.5
  '@angular-devkit/core': 22.2.5
  '@angular-devkit/schematics': 22.2.5
  '@angular/cli': 22.2.5
  # 1.2.2 is the last WASM runtime supporting this parser's exact emnapi alpha.3 pins.
  '@oxc-parser/binding-wasm32-wasi@0.150.0>@napi-rs/wasm-runtime': 1.2.2
  '@schematics/angular': 22.2.5
  glob: ^14.0.3
  immutable: ^5.1.9
  less: 4.9.1
  listr2: 11.4.0
  sass: ^1.107.0
  sharp: ^0.35.5

# Updates Yuku and fixes its codegen source-map API together.
minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.28.7

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
