packages:
  - 'packages/*'
  - 'demo'

overrides:
  '@angular-devkit/architect': 0.2202.7
  '@angular-devkit/core': 22.2.7
  '@angular-devkit/schematics': 22.2.7
  '@angular/cli': 22.2.7
  # 1.2.5 is the last WASM runtime supporting this parser's exact emnapi alpha.6 pins.
  '@oxc-parser/binding-wasm32-wasi@0.156.0>@napi-rs/wasm-runtime': 1.2.5
  '@schematics/angular': 22.2.7
  glob: ^14.0.6
  immutable: ^5.2.1
  less: 4.9.1
  listr2: 11.4.1
  sass: ^1.108.2
  sharp: ^0.35.5

# Updates Yuku and fixes its codegen source-map API together.
minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.28.7

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
