packages:
  - 'packages/*'
  - 'demo'

overrides:
  '@angular-devkit/architect': 0.2202.4
  '@angular-devkit/core': 22.2.4
  '@angular-devkit/schematics': 22.2.4
  '@angular/cli': 22.2.4
  '@schematics/angular': 22.2.4
  glob: ^13.0.6
  immutable: ^5.1.9
  less: 4.9.1
  listr2: 11.4.0
  sass: ^1.106.1
  sharp: ^0.35.5

# Updates Yuku and fixes its codegen source-map API together.
minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.28.7

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
