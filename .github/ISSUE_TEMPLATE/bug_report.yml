name: Bug Report
description: Create a report to help us improve
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug: Please describe the issue clearly and provide steps to reproduce.
  - type: input
    id: title
    attributes:
      label: Bug Title
      description: Short, descriptive title of the bug
      placeholder: Responsive image URL is incorrect after hydration
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
      placeholder: Describe the bug in detail
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Configure the image provider
        2. Render the image or picture component
        3. Resize or hydrate the page
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen? What actually happened?
      placeholder: |
        **Expected:** The optimized image loads with the documented attributes
        **Actual:** Describe the incorrect URL, markup, or behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, package versions, etc.
      placeholder: |
        - Browser: Chrome 120
        - Framework: Angular 21 or Svelte 5
        - Package: @desource/image-angular 0.1.0
        - Provider: ipx
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable
      placeholder: Drag and drop images here
    validations:
      required: false
  - type: textarea
    id: code
    attributes:
      label: Minimal Reproduction
      description: Provide a minimal code sample if possible
      placeholder: |
        ```js
        // Your code here
        ```
    validations:
      required: false
