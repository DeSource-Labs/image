<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>%sveltekit.status% · DeSource Image</title>
    <style>
      :root {
        color: #e8eef7;
        background: #07111f;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        flex-direction: column;
        background:
          radial-gradient(circle at 76% 35%, rgba(143, 184, 255, 0.15), transparent 26rem),
          radial-gradient(circle at 68% 58%, rgba(191, 244, 139, 0.08), transparent 24rem), #07111f;
      }
      main {
        position: relative;
        display: grid;
        width: min(1120px, calc(100% - 40px));
        min-height: 78vh;
        margin: auto;
        place-items: center start;
        overflow: hidden;
      }
      main::after {
        position: absolute;
        top: 19%;
        right: -3rem;
        width: min(48vw, 31rem);
        height: 58%;
        content: '';
        opacity: 0.6;
        border: 1px solid rgba(143, 184, 255, 0.18);
        background:
          linear-gradient(rgba(143, 184, 255, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(143, 184, 255, 0.07) 1px, transparent 1px),
          linear-gradient(145deg, rgba(143, 184, 255, 0.06), rgba(191, 244, 139, 0.025));
        background-size:
          2.5rem 2.5rem,
          2.5rem 2.5rem,
          auto;
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.28);
        clip-path: polygon(0 0, calc(100% - 4rem) 0, 100% 4rem, 100% 100%, 0 100%);
        transform: rotate(-6deg);
      }
      section {
        position: relative;
        z-index: 1;
        max-width: 650px;
        padding: 5rem 0;
      }
      .label {
        margin: 0 0 1.5rem;
        color: #bff48b;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(4.6rem, 14vw, 9rem);
        font-weight: 500;
        line-height: 0.86;
        letter-spacing: -0.07em;
      }
      .message {
        max-width: 34rem;
        margin: 2rem 0 0;
        color: #9eb0c6;
        font-size: 1.05rem;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.1rem;
        margin-top: 2.25rem;
        padding: 0 1.25rem;
        border-radius: 0.5rem;
        color: #07111f;
        background: #bff48b;
        font-size: 0.875rem;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #8fb8ff;
        outline-offset: 4px;
      }
      footer {
        display: flex;
        width: min(1120px, calc(100% - 40px));
        min-height: 6.5rem;
        margin: 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        border-top: 1px solid rgba(185, 209, 239, 0.14);
        color: #71849a;
        font-size: 0.78rem;
      }
      footer a {
        min-height: auto;
        margin: 0;
        padding: 0;
        color: #9eb0c6;
        background: none;
        font-size: inherit;
      }
      @media (max-width: 640px) {
        main,
        footer {
          width: min(100% - 24px, 1120px);
        }
        main::after {
          right: -14rem;
          width: 28rem;
          height: 23rem;
          opacity: 0.35;
        }
        footer {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 0.6rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="label">Server response</p>
        <h1>%sveltekit.status%</h1>
        <p class="message">%sveltekit.error.message%</p>
        <a href="/">Back to homepage</a>
      </section>
    </main>
    <footer>
      <span>DeSource Image</span>
      <span>React · Angular · Svelte</span>
    </footer>
  </body>
</html>
